<!-- AI label for any generated shot (Higgsfield or another model). Held for the full length of the shot, never animated away early.
     Bottom-left of the safe band. This is in addition to: TikTok "AI-generated content" toggle (realistic scenes or people),
     YouTube "altered or synthetic content" = Yes (photorealistic), and Meta's automatic "AI info" label. -->
<div id="SCENE-ailabel" class="mb-chip-dark ai-label" style="font-size: calc(22px * var(--type-scale, 1)); background: rgba(24,24,27,.78);">
  <span id="SCENE-ailabel-text" data-var-text="aiLabelText">AI-generated scene</span>
</div>
