<!-- Keyword CTA. Variables: ctaText (string). Examples: "Comment SITE" (Instagram), "Link in bio, or DM me SITE" (TikTok),
     "Link in the first comment" (LinkedIn), "Link in the first reply" (X). Never "free", "trial" or "try free". -->
<div id="SCENE-cta" class="mb-display keyword-cta" style="font-size: calc(64px * var(--type-scale, 1)); text-align: center;">
  <span id="SCENE-cta-text" data-var-text="ctaText">Comment SITE</span>
</div>
