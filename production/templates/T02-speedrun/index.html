<!doctype html>
<!--
  T02 UI speedrun (V02, V03, V04, V10, V14-after, V27, V41, V57, comment-reply episodes).
  Master 1080x1920, 32 s. Real screen captures only; every overlay letter is HTML.
  Layout per scene is fixed in seconds below; retime with `npx hyperframes timeline move|trim` (Studio-shaped edits).
  Captures live in assets/capture/ (gitignored). Set data-playback-rate on #sr-build to the factor the clock chip states.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"hookLine","type":"string","label":"Hook (frame 0, 3-7 words)","default":"One brief in. A whole website out."},
    {"id":"briefText","type":"string","label":"Sentence chip (the exact brief)","default":"\"A website for a family bakery in Leeds that opens at 7.\""},
    {"id":"timerLine","type":"string","label":"Composer line","default":"Timer&#39;s on."},
    {"id":"clockText","type":"string","label":"Clock chip (Real time · m:ss, or Sped up ×N)","default":"Sped up ×8"},
    {"id":"label1","type":"string","label":"Build label 1","default":"Headline."},
    {"id":"label2","type":"string","label":"Build label 2","default":"Menu."},
    {"id":"label3","type":"string","label":"Build label 3","default":"Opening hours."},
    {"id":"editRequest","type":"string","label":"Chat edit (typed exactly as sent)","default":"make it warmer and put the opening hours at the top"},
    {"id":"liveText","type":"string","label":"Live line (real measured total)","default":"Live. Real time 4:12."},
    {"id":"ctaText","type":"string","label":"Loop CTA","default":"What should I build next? Comment it."},
    {"id":"phoneScrollSrc","type":"string","label":"390-wide phone scroll of the published site","default":"assets/capture/phone-scroll.mp4"},
    {"id":"composerSrc","type":"string","label":"Composer typed by hand (2x UI)","default":"assets/capture/composer.mp4"},
    {"id":"buildSrc","type":"string","label":"Uncut build recording","default":"assets/capture/build-uncut.mp4"},
    {"id":"editSrc","type":"string","label":"One chat edit","default":"assets/capture/edit.mp4"},
    {"id":"publishSrc","type":"string","label":"Publish dialog and live address","default":"assets/capture/publish.mp4"},
    {"id":"musicSrc","type":"string","label":"Music bed (cleared for the platform)","default":"assets/audio/music.wav"},
    {"id":"voSrc","type":"string","label":"Founder voice-over","default":"assets/audio/vo.wav"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>T02 UI speedrun</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/shared/brand.css" />
    <style>
      body { margin: 0; background: #f8f7f4; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--mb-canvas); }
      .clip { position: absolute; }
      .full { inset: 0; }
      /* Phone: a flat rounded card with a 10 px ink bezel, upright, never tilted (no device photo, no hand). */
      .phone { left: 260px; top: 470px; width: 560px; height: 1212px; object-fit: cover; border-radius: 56px; border: 10px solid var(--mb-ink); box-shadow: var(--mb-shadow); background: #fff; }
      /* Desktop captures: a white card inside the band; punch-ins are GSAP scale on the video itself. */
      .desk { left: 65px; top: 560px; width: 950px; height: 594px; object-fit: cover; border-radius: var(--mb-radius-card); box-shadow: var(--mb-shadow); background: #fff; }
      .band-top { left: var(--safe-left); width: calc(var(--safe-right) - var(--safe-left)); top: var(--safe-top); text-align: left; }
      .line { font-size: calc(62px * var(--type-scale)); }
      .chip-slot { left: var(--safe-left); top: 1190px; width: calc(var(--safe-right) - var(--safe-left)); }
      .clock-slot { left: 640px; top: 492px; }
      .fmt-16x9 .phone { left: 1180px; top: 70px; width: 434px; height: 940px; }
      .fmt-16x9 .desk { left: 192px; top: 250px; width: 1100px; height: 688px; }
      .fmt-16x9 .chip-slot { top: 960px; }
      .fmt-16x9 .clock-slot { left: 1060px; top: 270px; }
      .fmt-4x5 .phone { left: 330px; top: 300px; width: 420px; height: 910px; }
      .fmt-4x5 .desk { top: 330px; height: 594px; }
      .fmt-4x5 .chip-slot { top: 1120px; }
    </style>
  </head>
  <body>
    <div id="root" class="fmt-9x16" data-composition-id="main" data-start="0" data-duration="32" data-width="1080" data-height="1920">
      <section id="sr-bg" class="clip full" data-start="0" data-duration="32" data-track-index="0" data-track-kind="graphics" style="background: var(--mb-canvas)"></section>

      <!-- Track 1: real captures, each timed on the video itself (never on a wrapper too) -->
      <video id="sr-phone-a" class="clip phone" data-start="0" data-duration="2" data-track-index="1" data-var-src="phoneScrollSrc" src="assets/capture/phone-scroll.mp4" muted playsinline></video>
      <video id="sr-composer" class="clip desk" data-start="2" data-duration="3" data-track-index="1" data-var-src="composerSrc" src="assets/capture/composer.mp4" muted playsinline></video>
      <video id="sr-build" class="clip desk" data-start="5" data-duration="15" data-track-index="1" data-playback-rate="8" data-var-src="buildSrc" src="assets/capture/build-uncut.mp4" muted playsinline></video>
      <video id="sr-edit" class="clip desk" data-start="20" data-duration="5" data-track-index="1" data-var-src="editSrc" src="assets/capture/edit.mp4" muted playsinline></video>
      <video id="sr-publish" class="clip desk" data-start="25" data-duration="3" data-track-index="1" data-var-src="publishSrc" src="assets/capture/publish.mp4" muted playsinline></video>
      <video id="sr-phone-b" class="clip phone" data-start="28" data-duration="4" data-track-index="1" data-var-src="phoneScrollSrc" src="assets/capture/phone-scroll.mp4" muted playsinline></video>

      <!-- Track 2: overlays (HTML type only) -->
      <div id="sr-hook" class="clip band-top" data-start="0" data-duration="2" data-track-index="2" data-track-kind="graphics">
        <div id="sr-hook-line" class="mb-display line" data-var-text="hookLine">One brief in. A whole website out.</div>
      </div>
      <div id="sr-chip" class="clip chip-slot" data-start="0" data-duration="5" data-track-index="3" data-track-kind="graphics">
        <div id="sr-chip-pill" class="mb-pill" style="font-size: calc(28px * var(--type-scale))"><span data-var-text="briefText">"A website for a family bakery in Leeds that opens at 7."</span></div>
      </div>
      <div id="sr-timer" class="clip band-top" data-start="2" data-duration="3" data-track-index="2" data-track-kind="graphics">
        <div id="sr-timer-line" class="mb-display line" data-var-text="timerLine">Timer's on.</div>
      </div>
      <div id="sr-clock" class="clip clock-slot" data-start="5" data-duration="23" data-track-index="3" data-track-kind="graphics">
        <div id="sr-clock-pill" class="mb-chip-dark" style="font-size: calc(24px * var(--type-scale))"><span data-var-text="clockText">Sped up ×8</span></div>
      </div>
      <div id="sr-labels" class="clip band-top" data-start="5" data-duration="15" data-track-index="2" data-track-kind="graphics">
        <div id="sr-l1" class="mb-display line" style="position:absolute" data-var-text="label1">Headline.</div>
        <div id="sr-l2" class="mb-display line" style="position:absolute; opacity:0" data-var-text="label2">Menu.</div>
        <div id="sr-l3" class="mb-display line" style="position:absolute; opacity:0" data-var-text="label3">Opening hours.</div>
      </div>
      <div id="sr-request" class="clip chip-slot" data-start="20" data-duration="5" data-track-index="3" data-track-kind="graphics">
        <div id="sr-request-pill" class="mb-pill" style="font-size: calc(28px * var(--type-scale))"><span data-var-text="editRequest">make it warmer and put the opening hours at the top</span></div>
      </div>
      <div id="sr-live" class="clip band-top" data-start="25" data-duration="3" data-track-index="2" data-track-kind="graphics">
        <div id="sr-live-line" class="mb-display line" data-var-text="liveText">Live. Real time 4:12.</div>
      </div>
      <div id="sr-cta" class="clip band-top" data-start="28" data-duration="4" data-track-index="2" data-track-kind="graphics">
        <div id="sr-cta-line" class="mb-display line" data-var-text="ctaText">What should I build next? Comment it.</div>
      </div>

      <!-- Track 4: captions (build with tools/captions-to-html.mjs from the VO transcript) -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="32" data-track-index="4" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- Audio: brand TikTok = Commercial Music Library track only; VO = the founder's own voice -->
      <audio id="sr-music" data-start="0" data-duration="32" data-track-index="8" data-volume="0.14" data-var-src="musicSrc" src="assets/audio/music.wav"></audio>
      <audio id="sr-vo" data-start="0" data-duration="32" data-track-index="9" data-volume="1" data-var-src="voSrc" src="assets/audio/vo.wav"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const rise = (sel, t) => tl.fromTo(sel, { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, t);
      // 0-2 s hook: output already on screen at frame 0 (never black); the phone scroll is the capture itself.
      tl.set("#sr-hook-line", { opacity: 1 }, 0);
      tl.fromTo("#sr-phone-a", { scale: 1 }, { scale: 1.015, duration: 2, ease: "none" }, 0);
      rise("#sr-chip-pill", 0.15);
      // 2-5 s composer typed by hand; punch-in toward the composer box (set transformOrigin to the box in the capture)
      rise("#sr-timer-line", 2.05);
      tl.fromTo("#sr-composer", { scale: 1, transformOrigin: "50% 60%" }, { scale: 1.28, duration: 2.6, ease: "power2.inOut" }, 2.2);
      // 5-20 s build: clock chip on for the whole build; three labels swap on cut points
      rise("#sr-clock-pill", 5.05);
      tl.fromTo("#sr-build", { scale: 1.06 }, { scale: 1, duration: 15, ease: "none" }, 5);
      tl.fromTo("#sr-l1", { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 5.2);
      tl.to("#sr-l1", { yPercent: -40, opacity: 0, duration: 0.25, ease: "power2.in" }, 9.6);
      tl.fromTo("#sr-l2", { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 9.9);
      tl.to("#sr-l2", { yPercent: -40, opacity: 0, duration: 0.25, ease: "power2.in" }, 14.6);
      tl.fromTo("#sr-l3", { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 14.9);
      // 20-25 s one chat edit: request chip, then the changed section is the only thing that moves (shown by the capture)
      rise("#sr-request-pill", 20.1);
      tl.fromTo("#sr-edit", { scale: 1 }, { scale: 1.12, duration: 4.8, ease: "power1.inOut" }, 20.1);
      // 25-28 s publish and the real address (in the capture, never typed over)
      rise("#sr-live-line", 25.1);
      // 28-32 s loop back to frame 0 so the replay is seamless
      rise("#sr-cta-line", 28.1);
      tl.fromTo("#sr-phone-b", { scale: 1.015 }, { scale: 1, duration: 4, ease: "none" }, 28);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
