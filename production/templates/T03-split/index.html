<!doctype html>
<!--
  T03 Before / after (V06, V14, V18, V30, V48, V49, V60). Master 1080x1920, 27 s.
  9:16 stacks BEFORE above AFTER (never two tiny side-by-side panels); 16:9 and 1:1 sit them side by side (.fmt-16x9 rules).
  Modes: "stack" (default), "wipe" (install the registry component before-after-wipe and mount it in #ba-wipe-slot),
  "onion" (AFTER at 50% over BEFORE to prove nothing else moved: V30).
  BEFORE must be genuinely ours (V14: the founder's own slides; V48: a dated site we built ourselves).
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"headline","type":"string","label":"Frame-0 line","default":"My slides vs. the same notes in Makeborne."},
    {"id":"beforeLabel","type":"string","label":"Before label","default":"Before: 2 hours"},
    {"id":"afterLabel","type":"string","label":"After label (measured)","default":"After: real time 3:40"},
    {"id":"pollText","type":"string","label":"Closing question","default":"Left or right?"},
    {"id":"mode","type":"enum","label":"Mode","default":"stack","options":[{"value":"stack","label":"Stack / side by side"},{"value":"wipe","label":"Wipe"},{"value":"onion","label":"Onion skin"}]},
    {"id":"beforeSrc","type":"string","label":"Before capture","default":"assets/capture/before.mp4"},
    {"id":"afterSrc","type":"string","label":"After capture","default":"assets/capture/after.mp4"},
    {"id":"musicSrc","type":"string","label":"Music bed","default":"assets/audio/music.wav"},
    {"id":"voSrc","type":"string","label":"Voice-over","default":"assets/audio/vo.wav"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>T03 before and after</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/shared/brand.css" />
    <style>
      body { margin: 0; background: #f8f7f4; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--mb-canvas); }
      .clip { position: absolute; }
      .pane { left: 65px; width: 950px; height: 440px; object-fit: cover; border-radius: var(--mb-radius-card); box-shadow: var(--mb-shadow); background: #fff; }
      #ba-before { top: 360px; }
      #ba-after { top: 840px; }
      .tag { left: 65px; font-size: calc(30px * var(--type-scale)); }
      #ba-before-tag { top: 300px; }
      #ba-after-tag { top: 1290px; }
      #ba-head { left: var(--safe-left); width: calc(var(--safe-right) - var(--safe-left)); top: 150px; font-size: calc(48px * var(--type-scale)); }
      .fmt-16x9 .pane { top: 300px; width: 760px; height: 475px; }
      .fmt-16x9 #ba-before { left: 160px; }
      .fmt-16x9 #ba-after { left: 1000px; }
      .fmt-16x9 #ba-before-tag { left: 160px; top: 800px; }
      .fmt-16x9 #ba-after-tag { left: 1000px; top: 800px; }
      .fmt-16x9 #ba-head { top: 130px; }
    </style>
  </head>
  <body>
    <div id="root" class="fmt-9x16" data-composition-id="main" data-start="0" data-duration="27" data-width="1080" data-height="1920">
      <section id="ba-bg" class="clip" style="inset: 0; background: var(--mb-canvas)" data-start="0" data-duration="27" data-track-index="0" data-track-kind="graphics"></section>
      <video id="ba-before" class="clip pane" data-start="0" data-duration="27" data-track-index="1" data-var-src="beforeSrc" src="assets/capture/before.mp4" muted playsinline></video>
      <video id="ba-after" class="clip pane" data-start="0" data-duration="27" data-track-index="2" data-var-src="afterSrc" src="assets/capture/after.mp4" muted playsinline></video>
      <div id="ba-head" class="clip mb-display" data-start="0" data-duration="27" data-track-index="3" data-track-kind="graphics" data-var-text="headline">My slides vs. the same notes in Makeborne.</div>
      <div id="ba-before-tag" class="clip mb-chip-dark tag" data-start="0" data-duration="27" data-track-index="4" data-track-kind="graphics" data-var-text="beforeLabel">Before: 2 hours</div>
      <div id="ba-after-tag" class="clip mb-chip-dark tag" data-start="10" data-duration="17" data-track-index="4" data-track-kind="graphics" data-var-text="afterLabel">After: real time 3:40</div>
      <div id="ba-poll" class="clip mb-display" style="left: var(--safe-left); top: 1340px; width: calc(var(--safe-right) - var(--safe-left)); text-align: center; font-size: calc(64px * var(--type-scale));" data-start="20" data-duration="7" data-track-index="3" data-track-kind="graphics" data-var-text="pollText">Left or right?</div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="27" data-track-index="5" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <audio id="ba-music" data-start="0" data-duration="27" data-track-index="8" data-volume="0.14" data-var-src="musicSrc" src="assets/audio/music.wav"></audio>
      <audio id="ba-vo" data-start="0" data-duration="27" data-track-index="9" data-volume="1" data-var-src="voSrc" src="assets/audio/vo.wav"></audio>
    </div>
    <script>
      const { mode } = window.__hyperframes ? window.__hyperframes.getVariables() : { mode: "stack" };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ba-before", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
      // Onion skin: lay AFTER exactly over BEFORE at 50% (transform only, never top/left), so viewers see that nothing else moved.
      const afterY = mode === "onion" ? -480 : 0;
      tl.fromTo("#ba-after", { y: afterY + 30, opacity: 0 }, { y: afterY, opacity: mode === "onion" ? 0.5 : 1, duration: 0.4, ease: "power3.out" }, 0.08);
      tl.fromTo("#ba-poll", { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 20.05);
      tl.fromTo("#ba-before", { scale: 1 }, { scale: 1.02, duration: 27, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
