<!doctype html>
<!--
  T10 UGC finishing pack (V32-V36, V53). Used only with the creator's approval, on the creator's own footage, for the Spark /
  partnership-ad version or a brand repost. Adds: the in-video ad disclosure (0-3 s), captions, and a 2.5 s end card with
  the creator's code. Never changes what the creator said, never adds claims, never replaces a person with an AI avatar.
  Master 1080x1920, 45 s.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"adText","type":"string","label":"In-video disclosure","default":"Ad · Paid partnership with Makeborne"},
    {"id":"handle","type":"string","label":"Creator handle (their own, with consent)","default":"@creator"},
    {"id":"code","type":"string","label":"Creator code","default":"CODE"},
    {"id":"creatorSrc","type":"string","label":"Creator video (sound on)","default":"assets/face/creator.mp4"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>T10 UGC pack</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/shared/brand.css" />
    <style>
      body { margin: 0; background: #18181b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #18181b; }
      .clip { position: absolute; }
      #ug-video { inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ug-ad { left: var(--safe-left); top: var(--safe-top); font-size: calc(26px * var(--type-scale)); }
      #ug-end { inset: 0; background: var(--mb-canvas); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; }
      #ug-end .mb-display { font-size: calc(64px * var(--type-scale)); }
    </style>
  </head>
  <body>
    <div id="root" class="fmt-9x16" data-composition-id="main" data-start="0" data-duration="45" data-width="1080" data-height="1920">
      <video id="ug-video" class="clip" data-start="0" data-duration="42.5" data-track-index="0" data-has-audio="true" data-var-src="creatorSrc" src="assets/face/creator.mp4" playsinline></video>
      <div id="ug-ad" class="clip mb-pill" data-start="0" data-duration="3" data-track-index="2" data-track-kind="graphics" data-var-text="adText">Ad · Paid partnership with Makeborne</div>
      <div id="ug-end" class="clip" data-start="42.5" data-duration="2.5" data-track-index="1" data-track-kind="graphics">
        <div class="mb-display">Link in bio · code <span class="mb-accent" data-var-text="code">CODE</span></div>
        <div class="mb-footnote" style="font-size:32px">From $20/mo + tax · Full refund until you use credits</div>
        <div class="mb-footnote" style="font-size:28px" data-var-text="handle">@creator</div>
      </div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="42.5" data-track-index="4" data-track-kind="captions" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ug-ad", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, 0);
      tl.fromTo("#ug-end", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 42.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
