<!doctype html>
<!-- T01 end card as a sub-composition (generated from templates/T01-endcard/index.html; edit T01 and regenerate). -->
<html lang="en" data-composition-variables='[
    {"id":"headLead","type":"string","label":"Headline lead","default":"Make yours at"},
    {"id":"headAccent","type":"string","label":"Accent word (Newsreader italic, gradient)","default":"makeborne.com"},
    {"id":"priceLine","type":"string","label":"Price line","default":"From $20/mo + tax"},
    {"id":"refundLine","type":"string","label":"Refund line","default":"Full refund until you use credits"},
    {"id":"ctaText","type":"string","label":"Keyword CTA (per platform)","default":"Comment SITE"}
  ]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/shared/brand.css" />
      <style>
            #root { position: absolute; inset: 0; overflow: hidden; background: var(--mb-canvas); }
      .clip { position: absolute; inset: 0; }
      #ec-stack {
        position: absolute; left: var(--safe-left); right: calc(100% - var(--safe-right));
        top: var(--safe-top); bottom: calc(100% - var(--safe-bottom));
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; text-align: center;
      }
      #ec-lockup { display: flex; align-items: center; gap: 16px; font-family: var(--mb-sans); font-weight: 640; font-size: calc(34px * var(--type-scale)); color: var(--mb-ink); }
      #ec-lockup img { height: calc(56px * var(--type-scale)); width: auto; }
      .ec-mask { overflow: hidden; padding: 0.06em 0.04em 0.12em; }
      #ec-head { font-size: calc(78px * var(--type-scale)); }
      #ec-price, #ec-refund { font-size: calc(34px * var(--type-scale)); }
      #ec-cta { margin-top: 18px; }
      .fmt-16x9 #ec-head { font-size: 104px; }
    </style>
      <div id="root" class="fmt-9x16" data-composition-id="endcard" data-width="1080" data-height="1920" data-duration="2.5">
        <section id="ec-bg" class="clip" data-start="0" data-duration="2.5" data-track-index="0" data-track-kind="graphics" style="background: var(--mb-canvas)"></section>

      <section id="ec-card" class="clip" data-start="0" data-duration="2.5" data-track-index="1" data-track-kind="graphics">
        <div id="ec-stack">
          <div id="ec-lockup"><img src="assets/shared/components/mark.svg" alt="" /><span>Makeborne</span></div>
          <div class="ec-mask"><div id="ec-head" class="mb-display"><span data-var-text="headLead">Make yours at</span> <span class="mb-accent" data-var-text="headAccent">makeborne.com</span></div></div>
          <div class="ec-mask"><div id="ec-price" class="mb-footnote" data-var-text="priceLine">From $20/mo + tax</div></div>
          <div class="ec-mask"><div id="ec-refund" class="mb-footnote" data-var-text="refundLine">Full refund until you use credits</div></div>
          <div id="ec-cta" class="mb-pill" style="font-size: calc(36px * var(--type-scale))"><span data-var-text="ctaText">Comment SITE</span></div>
        </div>
      </section>
      </div>
      <script>
      // Masked rise (power4.out), then dead still while read; the whole card drifts ~0.8%/s so the frame never parks.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ec-lockup", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, 0.0);
      tl.fromTo("#ec-head", { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "power4.out" }, 0.08);
      tl.fromTo("#ec-price", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "power4.out" }, 0.3);
      tl.fromTo("#ec-refund", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "power4.out" }, 0.38);
      tl.fromTo("#ec-cta", { y: 24, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0.55);
      tl.fromTo("#ec-stack", { scale: 1 }, { scale: 1.02, duration: 2.5, ease: "none" }, 0);
      window.__timelines["endcard"] = tl;
    </script>
    </template>
  </body>
</html>
