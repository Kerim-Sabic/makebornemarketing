<!doctype html>
<!--
  T11 Film recut wrapper (V01 now; V50 at the images beat). Master 1080x1920.
  V01: the finished v9 Fly-over 9:16 render (14.5 s) + the T01 end card (2.5 s) = 17 s. The v9 project itself stays read-only
  in the private film library; copy only its render into assets/capture/ (gitignored) and never edit the film project here.
  V50: the v14 fixes are made in the v14 film project (end card, concept line, publish address, names), re-rendered on a LOCAL
  disk (draft 2 failed on a network-drive rename). This wrapper only adds the 15 s 9:16 end card and the concept-line overlay
  for any frame that still shows concept art.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"filmSrc","type":"string","label":"Film render","default":"assets/capture/v9-flyover-9x16.mp4"},
    {"id":"hookLine","type":"string","label":"Hook over the first 2 s","default":"We launched today. This is the real studio."},
    {"id":"showConceptLine","type":"boolean","label":"Show the AI-concept line (v14 concept frames)","default":false}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>T11 film recut</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/shared/brand.css" />
    <style>
      body { margin: 0; background: #f8f7f4; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--mb-canvas); }
      .clip { position: absolute; }
      #fr-film { inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #fr-hook { left: var(--safe-left); width: calc(var(--safe-right) - var(--safe-left)); top: var(--safe-top); font-size: calc(52px * var(--type-scale)); }
      #fr-concept { left: var(--safe-left); top: 1180px; font-size: calc(36px * var(--type-scale)); color: var(--mb-ink); background: rgba(248,247,244,.9); padding: 8px 14px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div id="root" class="fmt-9x16" data-composition-id="main" data-start="0" data-duration="17" data-width="1080" data-height="1920">
      <video id="fr-film" class="clip" data-start="0" data-duration="14.5" data-track-index="0" data-has-audio="true" data-var-src="filmSrc" src="assets/capture/v9-flyover-9x16.mp4" playsinline></video>
      <div id="fr-hook" class="clip mb-display" data-start="0" data-duration="2.2" data-track-index="2" data-track-kind="graphics" data-var-text="hookLine">We launched today. This is the real studio.</div>
      <div id="fr-concept" class="clip mb-footnote" data-start="0" data-duration="14.5" data-track-index="3" data-track-kind="graphics">Projects shown are AI-generated concepts.</div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="14.5" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const { showConceptLine } = window.__hyperframes ? window.__hyperframes.getVariables() : { showConceptLine: false };
      const tl = gsap.timeline({ paused: true });
      tl.set("#fr-concept", { opacity: showConceptLine ? 1 : 0 }, 0);
      tl.fromTo("#fr-hook", { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, 0.05);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
